# 默认配置 —— 对应设计文档 §4「数据管道」
# 所有随机采样均由 seed 驱动，保证可复现。

seed: 20261009

audio:
  sample_rate: 16000        # PESQ 宽带模式要求 16 kHz
  duration: 4.0             # 秒，每条样本时长

# ── 麦克风阵列（设计文档 §4.3）──────────────────────────
array:
  type: circular            # circular | linear
  n_mics: 4
  radius: 0.04              # 米。4 元圆阵半径
  # 消融用（加分项，非验收范围）：
  #   type: linear, n_mics: 8, spacing: 0.04

# ── 房间（设计文档 §4.3）────────────────────────────────
room:
  size_range: [3.0, 8.0]    # 米，房间边长随机范围
  t60_range: [0.2, 0.8]     # 秒，混响时间随机范围
  source_distance_range: [1.0, 3.0]   # 米，声源到阵列距离
  source_azimuth_range: [0.0, 360.0]  # 度，方位角随机范围（真值记录，供 Oracle DOA）
  # 镜像源阶数上限。设 null 可恢复完整仿真（慢）。
  # 由 inverse_sabine 反推的阶数随「大房间 + 长 T60」急剧上升（实测中位 52、
  # 最大 114），而计算量随阶数超线性增长：阶数与耗时相关系数 0.927，
  # 最差情况 2.1 s/房间，是数据生成的主要瓶颈。
  # 但高阶层镜像源能量可忽略。实测（30 个房间，与无上限逐项对比）：
  #   上限 30 → 耗时降 5.9×，RIR 相对误差 1.9%，能量保留 99.94%
  #   上限 20 → 耗时降 11.6×，相对误差 5.6%，能量保留 99.66%
  # 对下游口径无影响：SNR 标定误差仍 0.0000 dB、通道相关度 0.1612 不变、
  # DRR 变化 < 0.04 dB（在重复实验的噪声水平内）。故取 30。
  max_order_cap: 30

# ── 噪声 ────────────────────────────────────────────────
noise:
  spatial_coherent: true    # 噪声经 RIR 卷积，模拟空间相干声场（与单通道增强的本质区别）
  train_snr_range: [-5.0, 10.0]   # 训练时随机 SNR
  eval_snr_levels: [-5.0, 0.0, 5.0]   # 评估时固定三档

# ── 评估（设计文档 §6.2）────────────────────────────────
evaluation:
  t60_levels: [0.3, 0.6]    # 低混响 / 高混响
  metrics: [pesq_wb, stoi, si_sdr]

# ── 数据（设计文档 §4.1 / §4.2）─────────────────────────
data:
  librispeech_root: data/LibriSpeech
  demand_root: data/DEMAND
  rir_cache: rirs/          # RIR 预生成缓存，不入库
  split:
    train_speakers: 30      # dev-clean 取 30 人
    val_speakers: 10        # dev-clean 余 10 人
    test_set: test-clean    # 全部 40 人
  # 仿真即增广（设计文档 §4.4）：5.4 h 语料 × 20 组房间配置 ≈ 108 h 等效数据
  room_configs_per_utterance: 20
  # 当前实际生成的样本量（data/sim/<split>/manifest.csv 的行数）。
  # 依据是 2026-10-10 的数据规模消融（默认 CRN、固定验证集 120 条、100 epoch）：
  #     240 条 → 验证 loss 0.04439
  #    1000 条 → 0.03267
  #    3000 条 → 0.02854（50 ep）/ 0.02652（100 ep）  相对 240 条降 40%
  # 关键现象：**在 240 条时更大的模型反而更差**（0.0444 vs 小模型 0.0408），
  # 到 1000 条才反超。说明先前是数据受限而非容量受限——扩数据比扩模型优先。
  # 3000 条时仍无过拟合迹象（验证 loss 略低于训练 loss），故上限尚未触及；
  # 但 1000→3000 的边际收益已明显小于 240→1000，继续大幅扩充前应先看长跑结果。
  # 生成条数由 scripts/generate_dataset.py --n 控制，不在此处配置。

# ── 训练 ────────────────────────────────────────────────
train:
  # batch_size 与 grad_accum_steps 的乘积（有效 batch）才是影响优化的量。
  # 实测（默认 CRN、240 条、有效 batch 恒为 16，见 2026-10-10 基准）：
  #   batch 4  / accum 4 → 显存 0.11 GB，0.47 s/epoch
  #   batch 8  / accum 2 → 显存 0.15 GB，0.21 s/epoch
  #   batch 16 / accum 1 → 显存 0.21 GB，0.13 s/epoch   ← 选它
  # 有效 batch 不变，单纯消除冗余 kernel 与反向传播，快 3.6 倍。
  # 显存远未用满（0.21 / 11.9 GB），真正的瓶颈是 CPU 侧 STFT。
  batch_size: 16
  grad_accum_steps: 1
  # 训练片段长度（采样点）。16000 = 1 s。样本本身是 4 s（64000 点）。
  #
  # 显存余量极大：默认 CRN + batch 16 + 1 s 片段峰值仅 0.21 / 11.9 GB（1.8%），
  # batch 可开到 512（4.7 GB）。因此**显存从来不是限制**，批大小也换不来速度
  # ——每样本耗时 0.6→0.4 ms 基本不变，因为 93% 的时间花在 CPU 侧数据加载
  # （端到端 ~137 ms/batch vs GPU 9 ms）。
  #
  # 片段长度的实测对比（2026-10-10，3000 条、default CRN、batch 16、100 epoch）：
  #   1 s 片段：16.8 s/epoch，最优验证 0.02661（1 s 窗口口径）
  #             → 换算到全长 501 帧口径为 0.03324（训练/评估长度不匹配，偏严）
  #   4 s 片段：88.0 s/epoch（慢 5.3×），仅 20 epoch 时全长口径已达 0.02993
  #             （优于 1 s 模型训满 91 epoch 的 0.03324），但该点已开始过拟合
  #             （train 0.02565 / val 0.02992，缺口 +0.0043）
  #
  # 结论：长上下文有实质价值，但 4 s 整条训练让每 epoch 只看到 1 个窗口，
  # 等于丢掉了随机裁剪带来的 ~15× 免费增广，因此很快过拟合。
  # **当前仍保留 1 s**——它是已验证可用的配置；要采用长片段，正确做法是
  # 「长片段 + RIR/噪声增广」或「按优化步数对齐后再比」，需先做实验确认。
  # 实测（默认 CRN、3000 条、batch 16、同种子，仅退火周期不同）：
  #   50 epoch  → 最优验证 loss 0.02854
  #   100 epoch → 最优验证 loss 0.02652（@ep 85），末 20 个 epoch 波动仅 2.9%
  # 即模型在 ~ep 85 收敛，100 是够用的退火周期（再长只会让算力落在平台上）。
  # 3000 条下一个 epoch 约 17 s，100 epoch 约 28 分钟，预算充裕。
  epochs: 100
  # 说明性字段：记录当前采用的训练片段长度与其依据（见上方注释）。
  # 实际由 `train.py --segment-length` 控制，此处仅作留痕。
  segment_length: 16000
  # 早停：验证损失连续多少个 epoch 无改善就停止。0 表示关闭、跑满 epochs。
  # 只监控**验证损失**——训练损失单调下降，用它做早停永远不会触发，
  # 因此没有验证集时不会启用（train.py 会在启动摘要里明确说明）。
  #
  # 标定（用 runs/w4 的 100 epoch 完整曲线回放）：
  #   最优 0.02661 出现在 epoch 91，且末段仍在缓慢改善。
  #   patience ∈ {10,15,20,25,30} **都不会触发** —— 即当前「3000 条 + 100
  #   epoch + 余弦退火」的配置本就该跑满，早停在此不省时间（这是好事：
  #   说明训练预算没有明显浪费）。
  #
  # 它的价值在「epochs 给多了」或「数据/模型变了导致早早收敛」的场景：
  #   例如把 epochs 提到 300、或换更大的模型后在 ep 60 就触底。
  # 取 20 而非更小，是为了避免把收敛前的正常波动误判为停滞
  # （实测过拟合场景下，验证损失触底后 2–3 个 epoch 内就会连续恶化，
  #   所以真有停滞时 20 也能很快抓到）。
  early_stop_patience: 20
  lr: 0.0002
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  amp: true                 # 混合精度
  grad_clip: 1.0
  # 必须为 0。实测（40 条样本、batch 2、随机片段）：
  #   num_workers=0 → 0.26 s/epoch
  #   num_workers=4 → 2.56 s/epoch   （慢 10 倍）
  # Windows 上每个 epoch 都要重建 worker 进程，而本项目的样本量很小、
  # 单条只需一次 STFT，进程启动开销远超省下的读取时间。
  # 在 Linux 或数据量大幅增加后再考虑调大。
  num_workers: 0
